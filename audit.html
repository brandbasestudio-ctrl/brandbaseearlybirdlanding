<style>
  :root{
    --paper:#FAFAFA;
    --gray:#E6E6E6;
    --black:#111111;
    --slate:#7A7A7A;
    --orange:#FF5A00;
    --display:'Poppins',sans-serif;
    --mono:'IBM Plex Mono',monospace;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--black);
    font-family:var(--mono);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 32px;}

  /* HEADER */
  header.site{border-bottom:1px solid var(--black); padding:22px 0;}
  header.site .wrap{display:flex; justify-content:space-between; align-items:center;}
  header.site .logo{height:80px; width:auto;}
  header.site .nav-tag{font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate);}
  @media (max-width:560px){ header.site .nav-tag{display:none;} header.site .logo{height:56px;} }

  /* FORM AREA */
  .audit-wrap{padding:56px 0 80px;}
  .audit-wrap h1{
    font-family:var(--display); font-weight:800; text-transform:uppercase;
    letter-spacing:-0.04em; line-height:0.95; font-size:clamp(28px,4vw,44px);
    margin:0 0 8px;
  }
  .audit-wrap .sub{
    font-size:15px; color:var(--slate); margin:0 0 40px;
  }
  .tally-wrap{
    border:1px solid var(--black);
    box-shadow:6px 6px 0 var(--black);
    background:var(--paper);
    min-height:500px;
  }
  .tally-wrap iframe{
    display:block;
    width:100%;
    min-height:700px;
    border:none;
  }

  /* FOOTER */
  footer{background:var(--black); padding:22px 0; border-top:1px solid #333;}
  footer .wrap{display:flex; justify-content:space-between; align-items:center;}
  footer .logo-w{height:24px; width:auto;}
  footer .meta{font-family:var(--mono); font-size:12px; color:#999;}
  footer .back{font-size:12px; color:var(--slate); text-decoration:none;}
  footer .back:hover{color:var(--orange);}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a href="index.html"><img class="logo" src="assets/logo-black.png" alt="brandbase"></a>
    <span class="nav-tag">Brand Visual Audit</span>
  </div>
</header>

<section class="audit-wrap">
  <div class="wrap">
    <h1>Brand Visual Audit</h1>
    <p class="sub">แบบทดสอบ 1 นาที เพื่อดูว่าภาพลักษณ์ของแบรนด์คุณกำลังช่วยหรือฉุดธุรกิจ</p>
    <div class="tally-wrap">
      <iframe
        src="https://tally.so/embed/Gx4aqj?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        width="100%"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Brand Visual Audit by brandbase">
      </iframe>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <img class="logo-w" src="assets/logo-white.png" alt="brandbase">
    <a href="index.html" class="back">← Back to brandbase</a>
  </div>
</footer>

<!-- Fire Meta Pixel Lead event + GA4 event when Tally form is submitted -->
<script>
window.addEventListener('message', function(e) {
  if (typeof e.data === 'object' && e.data.type === 'tally-form-submit') {
    // Meta Pixel
    if (typeof fbq !== 'undefined') {
      fbq('track', 'Lead');
    }
    // GA4
    if (typeof gtag !== 'undefined') {
      gtag('event', 'generate_lead', {
        event_category: 'audit',
        event_label: 'brand_visual_audit_submit'
      });
    }
  }
});
</script>

</body>
</html>
